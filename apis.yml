aid: nautilus-biotechnology
name: Nautilus Biotechnology
description: 'Nautilus Biotechnology is a publicly traded (NASDAQ: NAUT) life-sciences company
  developing a single-molecule protein analysis platform aimed at unlocking the proteome for
  basic biology, medicine, and drug discovery. Its Voyager platform pairs a novel single-molecule
  proteomics instrument with reagents and software to quantify and map proteoforms at scale.
  The company partners with academic and pharmaceutical researchers on applications spanning
  biomarker discovery and the drug-development process. Nautilus operates as a research-tools
  and instrument company; it publishes a corporate site, blog, resource library, and investor
  relations pages, but does not currently expose a public developer API, SDKs, or a developer
  portal. Surfaced as an a16z portfolio company and enriched from public sources.'
